[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsc"
version = "0.1.0"
description = "A Claude-Code-style terminal coding agent powered by DeepSeek"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dsc = "dsc.__main__:main"

[tool.setuptools.packages.find]
include = ["dsc*"]

[tool.setuptools.package-data]
dsc = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
